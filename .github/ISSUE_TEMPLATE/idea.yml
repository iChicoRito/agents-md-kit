name: Idea or request
description: Suggest a new option, rule, skill, doc or other improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Which kit version does it affect?
      options: [claude, agents, both, the installer, not sure]
