# Runs the installer tests on every push and pull request.
name: test

on:
  push:
  pull_request:

jobs:
  lint:
    name: Check scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck (Bash)
        run: shellcheck -S warning install.sh tests/test.sh
      - name: PSScriptAnalyzer (PowerShell)
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Force -Scope CurrentUser }
          $issues = Invoke-ScriptAnalyzer -Path install.ps1, tests/test.ps1 -Severity Error
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }

  bash:
    name: Bash on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tests
        shell: bash
        run: bash tests/test.sh

  powershell:
    name: ${{ matrix.shell }} on Windows
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tests
        shell: ${{ matrix.shell }}
        run: ./tests/test.ps1
