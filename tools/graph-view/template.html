<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>__TITLE_TEXT__ - Graph view</title>
<style>
/* Tokens follow shadcn/ui "zinc". Components below are plain-CSS versions of Card, Badge, Button, Input, Switch and Slider. */
:root {
  --radius: 0.5rem;
  --background: 240 10% 3.9%;
  --foreground: 0 0% 98%;
  --card: 240 10% 3.9%;
  --primary: 0 0% 98%;
  --primary-foreground: 240 5.9% 10%;
  --secondary: 240 3.7% 15.9%;
  --muted: 240 3.7% 15.9%;
  --muted-foreground: 240 5% 64.9%;
  --accent: 240 3.7% 15.9%;
  --border: 240 3.7% 15.9%;
  --input: 240 3.7% 15.9%;
  --ring: 240 4.9% 83.9%;
  --highlight: 262 83% 72%;
  --shadow: 0 0% 0%;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --background: 0 0% 100%;
  --foreground: 240 10% 3.9%;
  --card: 0 0% 100%;
  --primary: 240 5.9% 10%;
  --primary-foreground: 0 0% 98%;
  --secondary: 240 4.8% 95.9%;
  --muted: 240 4.8% 95.9%;
  --muted-foreground: 240 3.8% 46.1%;
  --accent: 240 4.8% 95.9%;
  --border: 240 5.9% 90%;
  --input: 240 5.9% 90%;
  --ring: 240 5.9% 10%;
  --highlight: 262 70% 50%;
  --shadow: 240 10% 20%;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: hsl(var(--background)); color: hsl(var(--foreground));
  font: 14px/1.45 var(--font); overflow: hidden; -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}
::selection { background: hsl(var(--highlight) / 0.35); }
:focus-visible { outline: 2px solid hsl(var(--ring)); outline-offset: 2px; }
h1, h2, p { margin: 0; }
button, input { font: inherit; color: inherit; }
* { scrollbar-width: thin; scrollbar-color: hsl(var(--border)) transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: hsl(var(--border)); border-radius: 999px; }
::-webkit-scrollbar-track { background: transparent; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: hsl(var(--muted-foreground)); }

#stage { position: fixed; inset: 0; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }

/* Card */
.card {
  background: hsl(var(--card)); color: hsl(var(--foreground));
  border: 1px solid hsl(var(--border)); border-radius: calc(var(--radius) + 2px);
  box-shadow: 0 1px 2px hsl(var(--shadow) / 0.25), 0 10px 28px -10px hsl(var(--shadow) / 0.5);
}

:root[data-theme="light"] .card { box-shadow: 0 1px 2px hsl(var(--shadow) / 0.1), 0 8px 24px -12px hsl(var(--shadow) / 0.22); }

/* Top bar */
.topbar { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; align-items: center; gap: 8px; pointer-events: none; }
.topbar > * { pointer-events: auto; }
.spacer { flex: 1; pointer-events: none !important; }
.brand { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; min-width: 0; }
.brand h1 { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 22ch; }
.brand .stats { display: flex; gap: 6px; }
.icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Badge */
.badge {
  display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 1px 9px;
  font-size: 12px; font-weight: 600; line-height: 1.5; white-space: nowrap;
  background: hsl(var(--secondary)); color: hsl(var(--foreground)); border: 1px solid transparent;
}
.badge.outline { background: transparent; border-color: hsl(var(--border)); }
.badge.xs { font-size: 11px; padding: 0 7px; font-weight: 500; color: hsl(var(--muted-foreground)); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

/* Input */
.search { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; width: min(380px, 100%); }
.search:focus-within { border-color: hsl(var(--ring)); }
.search input { flex: 1; min-width: 0; height: 100%; background: transparent; border: 0; outline: 0; font-size: 14px; }
.search input::placeholder { color: hsl(var(--muted-foreground)); }
.search input::-webkit-search-cancel-button { display: none; }
kbd {
  font: 11px var(--mono); padding: 1px 6px; border-radius: 4px;
  border: 1px solid hsl(var(--border)); background: hsl(var(--muted)); color: hsl(var(--muted-foreground));
}
#qcount { font-size: 12px; white-space: nowrap; }

/* Button */
.tools { display: flex; gap: 2px; padding: 4px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
  border: 1px solid transparent; background: transparent; border-radius: calc(var(--radius) - 2px);
  font-size: 13px; font-weight: 500; transition: background-color .15s, color .15s;
}
.btn:hover { background: hsl(var(--accent)); }
.btn[aria-pressed="true"] { background: hsl(var(--accent)); }
.btn.icon-only { width: 32px; height: 32px; padding: 0; }
.btn.outline { border-color: hsl(var(--border)); height: 32px; padding: 0 12px; }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
.btn:disabled { opacity: .5; pointer-events: none; }
#phys .i-play { display: none; }
#phys[aria-pressed="true"] .i-pause { display: none; }
#phys[aria-pressed="true"] .i-play { display: block; }
:root[data-theme="light"] #theme .i-sun { display: none; }
:root:not([data-theme="light"]) #theme .i-moon { display: none; }

/* Settings panel */
.panel { position: fixed; top: 64px; right: 12px; width: 296px; max-height: calc(100vh - 76px); overflow: auto; padding: 4px 0; }
.panel details { border-bottom: 1px solid hsl(var(--border)); }
.panel details:last-child { border-bottom: 0; }
.panel summary {
  display: flex; align-items: center; justify-content: space-between; list-style: none; cursor: pointer;
  padding: 12px 16px; font-weight: 600; font-size: 13px; user-select: none;
}
.panel summary::-webkit-details-marker { display: none; }
.panel summary .chev { transition: transform .2s cubic-bezier(.16, 1, .3, 1); color: hsl(var(--muted-foreground)); }
.panel details[open] summary .chev { transform: rotate(180deg); }
.panel .body { padding: 0 16px 14px; display: grid; gap: 14px; }
.row { display: grid; gap: 8px; }
.row.inline { grid-template-columns: 1fr auto; align-items: center; }
.row label, .row .lab { font-size: 13px; }
.row .val { font-size: 12px; color: hsl(var(--muted-foreground)); float: right; }

/* Switch */
.switch {
  position: relative; width: 36px; height: 20px; flex: none; cursor: pointer; padding: 0;
  border-radius: 999px; border: 2px solid transparent; background: hsl(var(--input)); transition: background-color .15s;
}
.switch::after {
  content: ""; position: absolute; top: 0; left: 0; width: 16px; height: 16px; border-radius: 50%;
  background: hsl(var(--background)); box-shadow: 0 1px 3px hsl(var(--shadow) / 0.4);
  transition: transform .18s cubic-bezier(.16, 1, .3, 1);
}
.switch[aria-checked="true"] { background: hsl(var(--primary)); }
.switch[aria-checked="true"]::after { transform: translateX(16px); }

/* Slider */
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 16px; margin: 0; background: transparent; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track {
  height: 6px; border-radius: 999px;
  background: linear-gradient(to right, hsl(var(--primary)) var(--p, 50%), hsl(var(--secondary)) var(--p, 50%));
}
input[type=range]::-moz-range-track { height: 6px; border-radius: 999px; background: hsl(var(--secondary)); }
input[type=range]::-moz-range-progress { height: 6px; border-radius: 999px; background: hsl(var(--primary)); }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 16px; height: 16px; margin-top: -5px; border-radius: 50%;
  background: hsl(var(--background)); border: 2px solid hsl(var(--primary)); box-shadow: 0 1px 3px hsl(var(--shadow) / 0.4);
}
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: hsl(var(--background)); border: 2px solid hsl(var(--primary)); }
input[type=range]:focus-visible { outline: 0; }
input[type=range]:focus-visible::-webkit-slider-thumb { outline: 2px solid hsl(var(--ring)); outline-offset: 2px; }

/* Groups */
.groups { display: grid; gap: 2px; margin: 0 -8px; }
.group {
  display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 10px; width: 100%; text-align: left;
  padding: 6px 8px; border-radius: calc(var(--radius) - 2px); border: 0; background: transparent; cursor: pointer; font-size: 13px;
}
.group:hover, .group:focus-visible { background: hsl(var(--accent)); }
.group .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.group .n { font-size: 12px; color: hsl(var(--muted-foreground)); }
.group .dot { width: 10px; height: 10px; border: 2px solid transparent; }
.group[aria-pressed="false"] { color: hsl(var(--muted-foreground)); }
.group[aria-pressed="false"] .dot { background: transparent !important; border-color: currentColor; }

/* Selection card */
.detail { position: fixed; left: 12px; bottom: 12px; width: 320px; max-width: calc(100vw - 24px); max-height: 46vh; display: flex; flex-direction: column; }
.detail header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding: 14px 8px 0 16px; }
.detail h2 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.detail .meta { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 16px 0; }
.detail .path { padding: 8px 16px 0; font: 12px var(--mono); color: hsl(var(--muted-foreground)); overflow-wrap: anywhere; }
.detail .sep { height: 1px; background: hsl(var(--border)); margin: 12px 0 0; }
.detail .list { overflow: auto; padding: 6px 8px 8px; min-height: 0; }
.detail .list-title { padding: 10px 16px 0; font-size: 12px; color: hsl(var(--muted-foreground)); }
.conn {
  display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 8px; width: 100%; text-align: left;
  padding: 5px 8px; border: 0; background: transparent; border-radius: calc(var(--radius) - 2px); cursor: pointer; font-size: 13px;
}
.conn:hover, .conn:focus-visible { background: hsl(var(--accent)); }
.conn .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.hint { position: fixed; right: 12px; bottom: 12px; font-size: 12px; padding: 6px 12px; transition: opacity .4s; }
.hint.gone { opacity: 0; pointer-events: none; }
.empty { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 20px 24px; text-align: center; max-width: 340px; }
.empty h2 { font-size: 15px; font-weight: 600; }
.empty p { margin-top: 6px; color: hsl(var(--muted-foreground)); }
.empty code { font: 12px var(--mono); }

@media (max-width: 720px) {
  .topbar { flex-wrap: wrap; }
  .brand .stats { display: none; }
  .search { order: 3; flex: 1 1 100%; width: auto; }
  .spacer { display: none; }
  .tools { margin-left: auto; }
  .panel { top: auto; left: 12px; right: 12px; bottom: 12px; width: auto; max-height: 58vh; }
  .panel:not([hidden]) ~ .detail { display: none; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<main id="stage"><canvas id="cv" tabindex="0" role="img" aria-label="Interactive graph"></canvas></main>

<header class="topbar">
  <div class="card brand">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></svg>
    <h1 id="title"></h1>
    <div class="stats"><span class="badge" id="b-nodes"></span><span class="badge" id="b-links"></span><span class="badge" id="b-groups"></span></div>
  </div>
  <label class="card search">
    <svg class="icon muted" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="q" type="search" placeholder="Search nodes" autocomplete="off" spellcheck="false" aria-label="Search nodes">
    <span id="qcount" class="muted"></span>
    <kbd id="qkbd">/</kbd>
  </label>
  <div class="spacer"></div>
  <div class="card tools" role="toolbar" aria-label="View controls">
    <button class="btn icon-only" id="fit" title="Fit to screen (F)" aria-label="Fit to screen"><svg class="icon" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/></svg></button>
    <button class="btn icon-only" id="phys" aria-pressed="false" title="Pause physics (Space)" aria-label="Pause physics"><svg class="icon i-pause" viewBox="0 0 24 24"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg><svg class="icon i-play" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></svg></button>
    <button class="btn icon-only" id="theme" title="Toggle theme" aria-label="Toggle theme"><svg class="icon i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg><svg class="icon i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
    <button class="btn icon-only" id="cfg" aria-pressed="false" aria-controls="panel" title="Graph settings" aria-label="Graph settings"><svg class="icon" viewBox="0 0 24 24"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg></button>
  </div>
</header>

<aside id="panel" class="card panel" aria-label="Graph settings" hidden></aside>
<section id="detail" class="card detail" aria-label="Selected node" hidden></section>
<p id="hint" class="card hint muted">Drag a node to pull its neighbors. Scroll to zoom.</p>
<div id="empty" class="card empty" hidden><h2>This graph has no nodes yet</h2><p>Run <code>graphify update .</code> in your project, then build this view again.</p></div>
<div id="live" class="sr" aria-live="polite"></div>

<script>/*__VENDOR__*/</script>
<script id="graph-data" type="application/json">/*__DATA__*/</script>
<script>
(() => {
"use strict";
const $ = (s) => document.querySelector(s);
const root = document.documentElement;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- data ---------- */
const raw = JSON.parse($("#graph-data").textContent);
const kindOf = (n) => n._callable_class ? "class" : n._callable ? (String(n.label || "").startsWith(".") ? "method" : "function") : (n.file_type || "node");
const nodes = (raw.nodes || []).map((n) => ({
  id: String(n.id), label: String(n.label ?? n.id), comm: n.community ?? 0, cname: n.community_name || "",
  kind: kindOf(n), file: n.source_file || "", loc: n.source_location || "", deg: 0, adj: [], vis: true,
}));
const byId = new Map(nodes.map((n) => [n.id, n]));
const links = [];
for (const e of raw.links || raw.edges || []) {
  const s = byId.get(String(e.source)), t = byId.get(String(e.target));
  if (!s || !t || s === t) continue;
  const l = { source: s, target: t, rel: String(e.relation || "").replace(/_/g, " "), weak: e.confidence === "INFERRED" || e.confidence === "AMBIGUOUS" };
  links.push(l); s.deg++; t.deg++; s.adj.push({ n: t, l }); t.adj.push({ n: s, l });
}
const N = nodes.length;
const maxDeg = Math.max(1, ...nodes.map((n) => n.deg));
const directed = !!raw.directed;

const raw_groups = new Map();
for (const n of nodes) {
  if (!raw_groups.has(n.comm)) raw_groups.set(n.comm, { id: n.comm, name: n.cname, count: 0 });
  const c = raw_groups.get(n.comm); c.count++; if (!c.name && n.cname) c.name = n.cname;
}
const ranked = [...raw_groups.values()].sort((a, b) => b.count - a.count);
const MAX_GROUPS = 10;
const comms = [];
ranked.forEach((c, i) => {
  if (ranked.length <= MAX_GROUPS + 2 || i < MAX_GROUPS) comms.push({ id: c.id, name: c.name || "Group " + c.id, count: c.count, visible: true, idx: i, other: false });
});
if (comms.length < ranked.length) {
  const rest = ranked.slice(comms.length);
  comms.push({ id: "other", name: `Other (${rest.length} small groups)`, count: rest.reduce((s, c) => s + c.count, 0), visible: true, idx: MAX_GROUPS, other: true });
}
const commMap = new Map(comms.map((c) => [c.id, c]));
const other = comms.find((c) => c.other);
const groupOf = new Map(ranked.map((c) => [c.id, commMap.get(c.id) || other]));
for (const n of nodes) n.group = groupOf.get(n.comm);
const hubs = new Set(N_HUBS(nodes));
const byDegree = [...nodes].sort((a, b) => b.deg - a.deg);
function N_HUBS(list) { return list.length > 40 ? [...list].sort((a, b) => b.deg - a.deg).slice(0, 10).filter((n) => n.deg >= 3) : []; }

/* ---------- colors ---------- */
const PAL = [[262, 83, 72], [199, 89, 62], [142, 66, 52], [35, 92, 60], [340, 82, 68], [173, 70, 46], [12, 85, 64], [221, 83, 70], [84, 62, 50], [291, 60, 68]];
function commColor(c, light) {
  if (c.other) return light ? "hsl(240,4%,62%)" : "hsl(240,5%,48%)";
  const [h, s, l] = PAL[c.idx % PAL.length];
  return `hsl(${h},${s}%,${light ? l - 20 : l}%)`;
}
let C = {};
const FONT = getComputedStyle(root).getPropertyValue("--font");
function readColors() {
  const cs = getComputedStyle(root);
  const light = root.dataset.theme === "light";
  const hsl = (name, a = 1) => { const [h, s, l] = cs.getPropertyValue(name).trim().split(/\s+/); return `hsla(${h},${s},${l},${a})`; };
  C = { light, bg: hsl("--background"), bg9: hsl("--background", 0.88), fg: hsl("--foreground"), muted: hsl("--muted-foreground"),
        link: hsl("--foreground", light ? 0.22 : 0.17), linkDim: hsl("--foreground", 0.06), hi: hsl("--highlight", 0.95), ring: hsl("--foreground") };
  for (const c of comms) c.color = commColor(c, light);
}

/* ---------- parameters ---------- */
const big = N > 3000;
const DEF = N <= 60 ? { repel: 170, dist: 90 } : N <= 600 ? { repel: 90, dist: 50 } : { repel: 40, dist: 30 };
const P = { center: 0.35, repel: DEF.repel, link: 1, dist: DEF.dist, size: 1, width: 1, fade: 0.45, orphans: true, arrows: directed };

const radius = (n) => clamp(3 + 1.8 * Math.sqrt(n.deg), 3, 16) * P.size;

/* ---------- simulation ---------- */
// The physics runs in a Web Worker: a big graph can take 50+ ms per step, and the page
// must keep drawing, panning and zooming at full speed meanwhile. The same code runs
// in the page when a worker cannot start.
function physics(d3, post) {
  let all = [], pairs = [], sim = null, link = null, paused = false, timer = null, size = 1, P = {};
  const radius = (n) => Math.min(16, Math.max(3, 3 + 1.8 * Math.sqrt(n.deg))) * size;
  const send = (first) => {
    const pos = new Float32Array(all.length * 2);
    for (let i = 0; i < all.length; i++) { pos[2 * i] = all[i].x; pos[2 * i + 1] = all[i].y; }
    post({ type: "pos", pos, first }, [pos.buffer]);
  };
  // one step at most every 16 ms, so small graphs move at the same speed as before
  const loop = () => {
    timer = null;
    if (paused || sim.alpha() < sim.alphaMin()) return;
    const t0 = Date.now(); sim.tick(); send(false);
    timer = setTimeout(loop, Math.max(0, 16 - (Date.now() - t0)));
  };
  const kick = () => { if (!timer && !paused) timer = setTimeout(loop, 0); };
  const forces = () => {
    link.distance(P.dist).strength((l) => P.link / Math.min(l.source.deg, l.target.deg));
    sim.force("charge").strength(-P.repel);
    sim.force("x").strength(P.center * 0.12); sim.force("y").strength(P.center * 0.12);
  };
  const show = (mask) => {
    sim.nodes(all.filter((n) => mask[n.i]));
    link.links(pairs.filter((l) => mask[l.source.i] && mask[l.target.i]));
    forces();
  };
  return (m) => {
    if (m.type === "init") {
      all = m.deg.map((deg, i) => ({ i, deg, x: m.pos[2 * i], y: m.pos[2 * i + 1] }));
      pairs = []; for (let i = 0; i < m.links.length; i += 2) pairs.push({ source: m.links[i], target: m.links[i + 1] });
      P = m.P; size = m.P.size; paused = m.paused;
      link = d3.forceLink([]);
      sim = d3.forceSimulation(all).stop()

  b.addEventListener("click", () => { P[key] = !P[key]; b.setAttribute("aria-checked", String(P[key])); onchange(); dirty = true; });
  return el("div", { class: "row inline" }, el("span", { class: "lab", text: label }), b);
}
const sliders = [];
function sliderRow(label, key, min, max, step, fmt, onchange) {
  const inp = el("input", { type: "range", min, max, step, "aria-label": label }), val = el("span", { class: "val" });
  const paint = () => { inp.value = P[key]; val.textContent = fmt(P[key]); inp.style.setProperty("--p", ((P[key] - min) / (max - min)) * 100 + "%"); };
  inp.addEventListener("input", () => { P[key] = parseFloat(inp.value); paint(); onchange(); dirty = true; });
  paint(); sliders.push({ key, paint });
  return el("div", { class: "row" }, el("div", {}, el("span", { class: "lab", text: label }), val), inp);
}
const reheat = () => applyForces(0.35);
const groupList = el("div", { class: "groups" });
for (const c of comms) {
  const b = el("button", { class: "group", "aria-pressed": "true", title: c.name },
    el("i", { class: "dot" }), el("span", { class: "name", text: c.name }), el("span", { class: "n", text: String(c.count) }));
  c.btn = b; c.dotEl = b.querySelector(".dot");
  b.addEventListener("click", () => { c.visible = !c.visible; b.setAttribute("aria-pressed", String(c.visible)); updateVisibility(); rebuild(0.5); runSearch(); if (selected && !selected.vis) select(null); });
  b.addEventListener("mouseenter", () => { hoverGroup = c.id; dirty = true; });
  b.addEventListener("mouseleave", () => { hoverGroup = null; dirty = true; });
  groupList.append(b);
}
const resetBtn = el("button", { class: "btn outline sm", text: "Reset forces", onclick: () => {
  Object.assign(P, { center: 0.35, repel: DEF.repel, link: 1, dist: DEF.dist }); sliders.forEach((s) => s.paint()); reheat();
} });
panel.append(
  section("Filters", [toggleRow("Show orphans", "orphans", () => { updateVisibility(); rebuild(0.4); runSearch(); })]),
  section("Groups", [groupList]),
  section("Display", [
    toggleRow("Show arrows", "arrows", () => {}),
    sliderRow("Node size", "size", 0.4, 2.5, 0.05, (v) => v.toFixed(2) + "x", () => phys.post({ type: "size", v: P.size })),
    sliderRow("Link thickness", "width", 0.3, 3, 0.1, (v) => v.toFixed(1) + "x", () => {}),
    sliderRow("Text fade threshold", "fade", 0, 1, 0.01, (v) => v.toFixed(2), () => {}),
  ]),
  section("Forces", [
    sliderRow("Center force", "center", 0, 1, 0.01, (v) => v.toFixed(2), reheat),
    sliderRow("Repel force", "repel", 0, 400, 5, (v) => String(v), reheat),
    sliderRow("Link force", "link", 0, 1.5, 0.05, (v) => v.toFixed(2), reheat),
    sliderRow("Link distance", "dist", 10, 300, 5, (v) => String(v), reheat),
    el("div", {}, resetBtn),
  ]),
);
cfgBtn.addEventListener("click", () => { panel.hidden = !panel.hidden; cfgBtn.setAttribute("aria-pressed", String(!panel.hidden)); });

/* ---------- toolbar and keys ---------- */
const physBtn = $("#phys");
function setPaused(v) {
  paused = v; physBtn.setAttribute("aria-pressed", String(v));
  physBtn.title = v ? "Resume physics (Space)" : "Pause physics (Space)"; physBtn.setAttribute("aria-label", v ? "Resume physics" : "Pause physics");
  phys.post({ type: "pause", v });
}
physBtn.addEventListener("click", () => setPaused(!paused));
$("#fit").addEventListener("click", () => fit(true));
function setTheme(t) {
  root.dataset.theme = t; try { localStorage.setItem("graph-theme", t); } catch (_) {}
  readColors(); refreshSwatches(); dirty = true;
}
$("#theme").addEventListener("click", () => setTheme(root.dataset.theme === "light" ? "dark" : "light"));
function refreshSwatches() { for (const c of comms) c.dotEl.style.background = c.color; if (selected) select(selected, false); }
addEventListener("keydown", (e) => {
  const typing = /^(input|textarea)$/i.test(document.activeElement && document.activeElement.tagName);
  if (e.key === "/" && !typing) { e.preventDefault(); q.focus(); q.select(); }
  else if (e.key === "Escape" && !typing) { if (selected) select(null); else if (!panel.hidden) cfgBtn.click(); }
  else if ((e.key === "f" || e.key === "F") && !typing && !e.ctrlKey && !e.metaKey) fit(true);
  else if (e.key === " " && !typing && (document.activeElement === document.body || document.activeElement === cv)) { e.preventDefault(); setPaused(!paused); }
});

/* ---------- start ---------- */
$("#title").textContent = raw.__title || "Graph";
$("#b-nodes").textContent = `${N.toLocaleString()} nodes`;
$("#b-links").textContent = `${links.length.toLocaleString()} links`;
$("#b-groups").textContent = `${comms.length.toLocaleString()} ${comms.length === 1 ? "group" : "groups"}`;
cv.setAttribute("aria-label", `Interactive graph with ${N} nodes and ${links.length} links`);
let stored = null; try { stored = localStorage.getItem("graph-theme"); } catch (_) {}
root.dataset.theme = stored === "light" ? "light" : "dark";
readColors(); refreshSwatches();
if (!N) { $("#empty").hidden = false; hint.hidden = true; $("#cfg").disabled = true; $("#fit").disabled = true; $("#phys").disabled = true; }
updateVisibility(); resize(); rebuild(0);
if (N) phys.post(initMsg()); // the first positions arrive settled, then the view fits them
requestAnimationFrame(frame);
window.__graph = { nodes, links, phys, get ready() { return ready; }, get view() { return { tx, ty, k, W, H }; }, select, fit, setPaused, pick, get paused() { return paused; } };
})();
</script>
</body>
</html>
